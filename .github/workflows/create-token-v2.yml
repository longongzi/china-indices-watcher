name: Create PyPI Token

on:
  push:
    branches: [create-token]

jobs:
  create-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests pyotp playwright

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Create PyPI API Token via Playwright
        env:
          PYPI_USER: "lonongzi"
          PYPI_PASS: "iioopp.123"
          PYPI_TOTP_SECRET: "ZZ4OL5CUEPF2W4QCRGJNA5DIKLRMLKTX"
        run: python .github/scripts/create_pypi_token.py

      - name: Upload token as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypi-token
          path: /tmp/pypi_token.txt
          if-no-files-found: error
