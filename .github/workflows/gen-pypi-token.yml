name: Create PyPI Token (Playwright)
on:
  workflow_dispatch:

jobs:
  create-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install playwright pyotp
          playwright install chromium

      - name: Create API token on PyPI
        env:
          PYPI_USER: "lonongzi"
          PYPI_PASS: "iioopp.123"
          PYPI_TOTP_SECRET: "ZZ4TENABL5LFFK6X"
          PYPI_TOTP_SECRET2: "ZZ4OL5CUEPF2W4QCRGJNA5DIKLRMLKTX"
        run: python .github/scripts/create_pypi_token.py